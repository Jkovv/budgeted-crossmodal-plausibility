[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "budgeted-crossmodal-plausibility"
version = "0.1.0"
description = "Cross-modal plausibility checks against EDC range rules at a fixed query budget, on the MIMIC-IV demo resampled to a clinical trial visit schedule"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Julia Kowalczuk" }]
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.2",
    "pandas==2.2.3",
    "pyarrow==25.0.1",
    "scipy==1.14.1",
    "scikit-learn==1.7.1",
    "lightgbm==4.6.0",
    "matplotlib==3.10.6",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "jupyterlab==4.5.6", "nbconvert==7.17.0", "nbformat==5.10.4", "ipykernel==7.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
